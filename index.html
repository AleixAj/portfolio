<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Aleix Auqué · Software Developer</title>
    <meta name="description" content="Portfolio de Aleix Auqué, desarrollador de software full-stack con más de 5 años de experiencia en React, Three.js, Laravel y Cloudflare. Disponible para nuevas oportunidades." />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://aleixaj.com/" />

    <!-- Multilingual: ?lang= gives each language a real, shareable URL. The app
         reads it on load and keeps <html lang>, the canonical link and the meta
         tags in sync, so these alternates point at pages that truly exist. -->
    <link rel="alternate" hreflang="es" href="https://aleixaj.com/" />
    <link rel="alternate" hreflang="en" href="https://aleixaj.com/?lang=en" />
    <link rel="alternate" hreflang="ca" href="https://aleixaj.com/?lang=ca" />
    <link rel="alternate" hreflang="x-default" href="https://aleixaj.com/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aleixaj.com/" />
    <meta property="og:site_name" content="Aleix Auqué Portfolio" />
    <meta property="og:title" content="Aleix Auqué · Software Developer" />
    <meta property="og:description" content="Portfolio de Aleix Auqué, desarrollador de software full-stack con más de 5 años de experiencia en React, Three.js, Laravel y Cloudflare. Disponible para nuevas oportunidades." />
    <meta property="og:image" content="https://aleixaj.com/og-image.png?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aleix Auqué · Software Developer" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ca_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aleix Auqué · Software Developer" />
    <meta name="twitter:description" content="Portfolio de Aleix Auqué, desarrollador de software full-stack con más de 5 años de experiencia en React, Three.js, Laravel y Cloudflare. Disponible para nuevas oportunidades." />
    <meta name="twitter:image" content="https://aleixaj.com/og-image.png?v=5" />
    <meta name="twitter:image:alt" content="Aleix Auqué · Software Developer" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Speed up the contact form's first request -->
    <link rel="preconnect" href="https://api.emailjs.com" />

    <!-- Fonts are self-hosted (see index.css). Only the latin ranges are preloaded:
         they cover the three languages of the site, and the rest load on demand. -->
    <link rel="preload" href="/fonts/dm-sans-rP2Hp2ywxg089UriCZOIHQ.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-V8mDoQDjQSkFtoMM3T6r8E7mPbF4Cw.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload the hero 3D model before React mounts the scene. Gated to desktop
         widths: on phones the 3 MB model would compete with the critical CSS/JS,
         and the scene itself may be skipped entirely (data saver / slow network),
         in which case the file is never requested. -->
    <link rel="preload" href="/gaming_bedroom.glb" as="fetch" type="model/gltf-binary" crossorigin fetchpriority="high" media="(min-width: 1024px)" />

    <!-- Structured data so search engines know who this page is about.
         A WebSite that belongs to a Person, with the Person in full. -->
    <script type="application/ld+json">

        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://aleixaj.com/#website",
            "url": "https://aleixaj.com/",
            "name": "Aleix Auqué · Software Developer",
            "inLanguage": ["es", "en", "ca"],
            "author": { "@id": "https://aleixaj.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://aleixaj.com/#person",
            "name": "Aleix Auqué",
            "jobTitle": "Software Developer",
            "description": "Full-stack software developer with 5+ years of experience in React, TypeScript, Laravel, PHP and Supabase. Creator of Orbex, a mobile game on Google Play.",
            "url": "https://aleixaj.com/",
            "image": "https://aleixaj.com/og-image.png",
            "email": "mailto:aleixauque@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Reus",
              "addressRegion": "Catalunya",
              "addressCountry": "ES"
            },
            "knowsLanguage": ["es", "ca", "en"],
            "alumniOf": [
              { "@type": "EducationalOrganization", "name": "INS Baix Camp" },
              { "@type": "Organization", "name": "Lemoncoders" },
              { "@type": "Organization", "name": "Fundació Esplai" }
            ],
            "hasCredential": {
              "@type": "EducationalOccupationalCredential",
              "name": "CFGS Desarrollo de Aplicaciones Web (DAW)",
              "credentialCategory": "degree"
            },
            "sameAs": [
              "https://github.com/AleixAj",
              "https://linkedin.com/in/aleixauque/"
            ],
            "knowsAbout": [
              "React",
              "TypeScript",
              "JavaScript",
              "Three.js",
              "React Three Fiber",
              "Electron",
              "Laravel",
              "PHP",
              "Python",
              "Node.js",
              "PostgreSQL",
              "MySQL",
              "Supabase",
              "REST APIs",
              "Cloudflare",
              "GitHub Actions",
              "Godot"
            ]
          }
        ]
      }
    </script>
  </head>
  <body style="font-family: 'DM Sans', sans-serif; background-color: #000;">

</html>
