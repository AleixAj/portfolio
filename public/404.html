<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · Aleix Auqué</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!--
      Served by Cloudflare for any path that doesn't exist (wrangler.jsonc:
      not_found_handling = "404-page"). The site only lives at "/" (views and
      languages are query parameters), so there is no SPA fallback: a missing
      file under /assets/ gets a real 404 instead of index.html, which browsers
      would otherwise cache as if it were the script or stylesheet.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; }
      body {
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px;
        background: radial-gradient(circle at 50% 45%, rgba(34, 211, 238, 0.14), transparent 45%), #000;
      }
      img { height: 56px; width: auto; filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.5)); }
      h1 { margin: 20px 0 6px; font-size: 64px; letter-spacing: 0.08em; color: #22d3ee; }
      p { margin: 4px 0; color: rgba(255, 255, 255, 0.65); }
      a {
        display: inline-block; margin-top: 24px; padding: 12px 22px; border-radius: 14px;
        background: #22d3ee; color: #000; font-weight: 700; text-decoration: none;
      }
      a:hover { background: #67e8f9; }
    </style>
  </head>
  <body>
    <main>
      <img src="/AJ.png" alt="Aleix Auqué" />
      <h1>404</h1>
      <p>Esta página no existe.</p>
      <p lang="en">This page doesn't exist.</p>
      <p lang="ca">Aquesta pàgina no existeix.</p>
      <a href="/">aleixaj.com</a>
    </main>
  </body>
</html>
